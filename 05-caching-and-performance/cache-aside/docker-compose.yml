services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cache_aside
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/001_create_products.sql:/docker-entrypoint-initdb.d/001_create_products.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d cache_aside
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    command:
      - redis-server
      - --appendonly
      - "yes"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data: