services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: isolation_lab
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d isolation_lab"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data: