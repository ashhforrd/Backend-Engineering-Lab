services:
  postgres:
    image: postgres:17-alpine
    container_name: db-index-benchmark-postgres
    environment:
      POSTGRES_DB: index_benchmark
      POSTGRES_USER: benchmark
      POSTGRES_PASSWORD: benchmark
    ports:
      - "5435:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U benchmark -d index_benchmark
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - index_benchmark_data:/var/lib/postgresql/data

volumes:
  index_benchmark_data: